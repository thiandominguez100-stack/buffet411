<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a40">
<meta name="robots" content="noindex,nofollow">
<title>Buffet 411 · Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1f8f4e;--verde-osc:#17693a;--verde-cl:#e4f3ea;--azul:#1e6fa8;--azul-osc:#0f4c75;--azul-cl:#e6eff6;--tinta:#0e1a23;--gris:#54626d;--linea:#d3dae0;--fondo:#edf0f3;--ambar:#b7791f;--ambar-cl:#fdf3dc;--rojo:#c53030;--rojo-cl:#fde8e8;--r:3px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:3px;background:#fff;object-fit:contain}
header h1{font-size:1.05rem;flex:1}
.wrap{max-width:760px;margin:auto;padding:14px 16px 40px}
.card{background:#fff;border-radius:3px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(19,35,47,.06)}
.mut{color:var(--gris);font-size:.78rem}
input,select{width:100%;padding:12px;border:2px solid var(--linea);border-radius:3px;font:inherit;background:#fff}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st{background:#fff;border-radius:3px;padding:10px;text-align:center;box-shadow:0 2px 10px rgba(19,35,47,.06)}
.st b{display:block;font-size:1.15rem}
.prep{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.prep span{background:var(--ambar-cl);color:var(--ambar);padding:8px 14px;border-radius:3px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:1.35rem;font-weight:700;letter-spacing:.12em}
button{font:600 .82rem Inter,sans-serif;border:0;border-radius:3px;padding:10px 12px;cursor:pointer;background:var(--azul);color:#fff}
button.ok{background:var(--verde)}button.am{background:var(--ambar)}button.no{background:#fff;color:var(--rojo);border:2px solid var(--rojo)}button.l{background:none;color:#fff;padding:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.7rem;padding:3px 10px;border-radius:3px;font-weight:600;background:var(--azul-cl);color:var(--azul-osc);margin-left:4px}
.tag.listo,.tag.cobrado{background:var(--verde-cl);color:var(--verde-osc)}.tag.verificar{background:var(--ambar-cl);color:var(--ambar)}
.tag.cancelado,.tag.noretirado{background:var(--rojo-cl);color:var(--rojo)}
#lock{max-width:320px;margin:18vh auto;text-align:center}
#lock input{text-align:center;font-size:1.6rem;letter-spacing:.5em;margin:14px 0}
.err{color:var(--rojo);font-size:.85rem;min-height:1.3em}

/* ===== Tema sobrio: líneas rectas, tonos fríos y luz sutil ===== */
@keyframes barrido{0%{background-position:-60% 0,0 0}100%{background-position:160% 0,0 0}}
@keyframes brillo{0%,100%{text-shadow:0 0 0 rgba(30,111,168,0)}50%{text-shadow:0 0 14px rgba(30,111,168,.55)}}
@keyframes destello{0%,70%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
header{background:#0d2a40;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#5cc3ff,transparent) 0 0/40% 100% no-repeat,rgba(255,255,255,.14);animation:barrido 4.5s linear infinite}
h2{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);font-weight:700}
.card,.st{box-shadow:none;border:1px solid var(--linea)}
.card{border-left:3px solid var(--azul)}
button{position:relative;overflow:hidden;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;font-weight:700}
button:hover:not(.l):not(.pick)::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:destello .9s ease-out 1;pointer-events:none}
input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(30,111,168,.18),0 0 14px rgba(30,111,168,.3)}
.code{animation:brillo 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.tag.vencido{background:var(--ambar-cl);color:var(--ambar)}
@media print{header,.f,.noprint,.acts{display:none!important}body{background:#fff}.card,.st{break-inside:avoid;box-shadow:none}}
</style></head><body>
<div id="app"></div>
<script>
/* ===== Datos: mismas claves que index.html (reemplazable por Firebase más adelante) ===== */
const K={pedidos:'b411_orders',staff:'b411_stafflog',pin:'b411_pinlock'};
const DB={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
/* ===== Acceso del personal =====
   El PIN queda visible en el código (y el repositorio es público): frena a curiosos, no es seguridad real.
   Con Firebase se reemplaza por cuentas de personal. */
const PIN='1234'; // <-- CAMBIAR antes de usar
const TZ='America/Argentina/Cordoba';
const TURNOS=[{id:1,n:'1° recreo',ini:'08:50',fin:'09:00'},{id:2,n:'2° recreo',ini:'10:20',fin:'10:30'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('es-AR');
const hm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); // la búsqueda ignora tildes
/* Hora de Argentina, igual que la app de alumnos (no depende del reloj ni la zona del celular) */
function ahora(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return{fecha:`${g('year')}-${g('month')}-${g('day')}`,min:(Number(g('hour'))%24)*60+Number(g('minute'))};
}
const S={fecha:ahora().fecha,turno:'0',q:'',orden:'hora'};

function lockScreen(){
  $('app').innerHTML=`<div id="lock" class="card"><h1 style="font-size:1.15rem">Buffet 411 · Personal</h1><p class="mut">Ingresá el PIN</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><div class="err" id="err"></div><button style="width:100%" onclick="tryPin()">Entrar</button></div>`;
  $('pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});$('pin').focus();
}
/* El bloqueo se guarda en el navegador: recargar la página no lo reinicia */
function tryPin(){
  const l=DB.get(K.pin,{n:0,hasta:0});
  if(l.hasta>Date.now()){$('err').textContent='Bloqueado. Esperá '+Math.ceil((l.hasta-Date.now())/1000)+' segundos.';return}
  if($('pin').value===PIN){DB.set(K.pin,{n:0,hasta:0});sessionStorage.setItem('b411_staff','1');panel();return}
  l.n++;$('pin').value='';
  if(l.n>=3){l.n=0;l.hasta=Date.now()+30000;$('err').textContent='Bloqueado 30 segundos.'}else $('err').textContent='PIN incorrecto';
  DB.set(K.pin,l);
}
function salir(){sessionStorage.removeItem('b411_staff');lockScreen()}

/* ===== Gestión de pedidos ===== */
const lista=()=>DB.get(K.pedidos,[]);
function cambiar(id,accion){
  const l=lista(),o=l.find(x=>x.id===id);if(!o)return;   // se lee la lista justo antes de guardar
  if(accion==='cancelar'&&!confirm('¿Cancelar el pedido '+o.codigo+'? Se libera el stock.'))return;
  if(accion==='noretiro'&&!confirm('¿Marcar que el pedido '+o.codigo+' NO fue retirado? Cuenta como falta del alumno.'))return;
  if(accion==='reabrir'&&!confirm('¿Reabrir el pedido '+o.codigo+'? Vuelve a estar pendiente.'))return;
  if(accion==='cobrar'&&o.metodo==='transferencia'&&o.pago!=='cobrado'&&!confirm('Este pedido era por transferencia. ¿Ya verificaste el pago en Mercado Pago?'))return;
  if(accion==='listo')o.estado='listo';
  if(accion==='cobrar'){o.estado='retirado';o.pago='cobrado'}        // retirado y cobrado
  if(accion==='transf')o.pago='cobrado';                              // transferencia verificada en Mercado Pago
  if(accion==='cancelar')o.estado='cancelado';
  if(accion==='noretiro')o.estado='noretirado';                       // el personal confirma que no vino
  if(accion==='reabrir'){o.estado='pendiente';o.pago=o.metodo==='transferencia'?'a_verificar':'por_cobrar'}
  o.actualizado=Date.now();DB.set(K.pedidos,l);
  const log=DB.get(K.staff,[]);log.push({accion,codigo:o.codigo,ts:Date.now()});DB.set(K.staff,log.slice(-500));
  render();
}
/* "Sin definir": pasó la ventana (hasta las 10:30) y nadie marcó si retiró o no */
function visible(o){
  if(o.estado==='pendiente'||o.estado==='listo'){
    const n=ahora();
    if(o.fecha<n.fecha||(o.fecha===n.fecha&&n.min>=hm(TURNOS[1].fin)))return'vencido';
  }return o.estado;
}
const ETQ={pendiente:'Pendiente',listo:'Listo para retirar',retirado:'Retirado',cancelado:'Cancelado',noretirado:'No retirado',vencido:'Sin definir'};

/* ===== Vistas ===== */
function panel(){
  $('app').innerHTML=`<header><img src="logo.png" alt="" onerror="this.style.display='none'"><h1>Pedidos del buffet</h1><button class="l" onclick="salir()">Salir</button></header><div class="wrap">
  <div class="f"><div><label class="mut" for="d">Fecha</label><input type="date" id="d" value="${S.fecha}"></div>
  <div><label class="mut" for="t">Recreo</label><select id="t"><option value="1">1° · 08:50 a 09:00</option><option value="2">2° · 10:20 a 10:30</option><option value="0">Todos</option></select></div></div>
  <div id="info" class="mut noprint" style="margin-bottom:10px"></div><div id="sum"></div>
  <div class="noprint" style="display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:4px 0 12px"><input id="q" placeholder="Buscar nombre, curso o código" aria-label="Buscar"><select id="o" aria-label="Orden"><option value="hora">Por hora</option><option value="curso">Por curso</option></select><button onclick="window.print()">Imprimir</button></div>
  <div id="list"></div></div>`;
  $('t').value=S.turno;$('o').value=S.orden;
  $('d').onchange=e=>{S.fecha=e.target.value||ahora().fecha;render()};
  $('t').onchange=e=>{S.turno=e.target.value;render()};
  $('o').onchange=e=>{S.orden=e.target.value;render()};
  $('q').oninput=e=>{S.q=norm(e.target.value.trim());render()};
  render();
}
let sig='';
/* render(true) = refresco automático: solo redibuja si cambió algo, así no se pierde un toque */
function render(auto){
  if(!$('list'))return;
  const n=ahora(),s=(localStorage.getItem(K.pedidos)||'')+'|'+S.fecha+S.turno+S.q+S.orden+'|'+n.fecha+(n.min>=hm(TURNOS[1].fin));
  if(auto===true&&s===sig)return;sig=s;
  const todos=lista(),fechas={};todos.filter(o=>o.estado!=='cancelado').forEach(o=>fechas[o.fecha]=(fechas[o.fecha]||0)+1);
  const otras=Object.entries(fechas).filter(([f])=>f!==S.fecha).map(([f,c])=>`<a href="#" onclick="S.fecha='${f}';$('d').value='${f}';render();return false">${f.split('-').reverse().join('/')} (${c})</a>`).join(' · ');
  $('info').innerHTML=`Pedidos guardados en este navegador: <b>${todos.length}</b>${otras?'<br>Otras fechas con pedidos: '+otras:''}${todos.length?'':'<br>Si hiciste un pedido y no aparece, lo hiciste en otro celular o navegador: hasta conectar Firebase cada uno guarda lo suyo.'}`;
  const all=todos.filter(o=>o.fecha===S.fecha&&(S.turno==='0'||String(o.turno)===S.turno))
    .sort((a,b)=>S.orden==='curso'?String(a.curso).localeCompare(String(b.curso),'es',{numeric:true})||String(a.nombre).localeCompare(String(b.nombre),'es'):a.creado-b.creado);
  const vivos=all.filter(o=>o.estado!=='cancelado');
  const sinRet=vivos.filter(o=>o.estado==='noretirado'||visible(o)==='vencido'),util=vivos.filter(o=>!sinRet.includes(o));
  /* Para preparar: lo que todavía no se retiró (sin contar lo que ya no se va a retirar) */
  const tot={};util.filter(o=>o.estado!=='retirado').forEach(o=>o.items.forEach(i=>tot[i.nombre]=(tot[i.nombre]||0)+i.cant));
  const prep=Object.entries(tot).map(([nom,q])=>`<span>${q} × ${esc(nom)}</span>`).join('')||'<span class="mut" style="background:none">Nada para preparar</span>';
  const cobrado=vivos.filter(o=>o.pago==='cobrado'),porCobrar=util.filter(o=>o.pago!=='cobrado');
  const suma=a=>a.reduce((x,o)=>x+o.total,0);
  const efe=suma(cobrado.filter(o=>o.metodo!=='transferencia')),tr=suma(cobrado.filter(o=>o.metodo==='transferencia'));
  $('sum').innerHTML=`<div class="card"><b>Para preparar</b><div class="prep">${prep}</div></div>
  <div class="grid"><div class="st"><span class="mut">Pedidos</span><b>${vivos.length}</b></div>
  <div class="st"><span class="mut">Por cobrar</span><b>${money(suma(porCobrar))}</b></div>
  <div class="st"><span class="mut">Cobrado</span><b style="color:var(--verde-osc)">${money(suma(cobrado))}</b></div></div>
  <p class="mut" style="margin-bottom:10px">Cobrado: ${money(efe)} en efectivo · ${money(tr)} por transferencia · Sin retirar: ${sinRet.length}</p>`;
  const q=S.q,shown=all.filter(o=>!q||[o.nombre,o.curso,o.codigo,o.usuario].some(v=>norm(v).includes(q)));
  $('list').innerHTML=shown.map(o=>{
    const v=visible(o),activo=o.estado==='pendiente'||o.estado==='listo',cerrado=o.estado==='retirado'||o.estado==='noretirado';
    const pg=o.pago==='cobrado'?'<span class="tag cobrado">Pagado</span>':o.metodo==='transferencia'?'<span class="tag verificar">Transferencia a verificar</span>':'<span class="tag">Efectivo por cobrar</span>';
    return `<div class="card"><div class="row"><span class="code">${esc(o.codigo)}</span><span><span class="tag ${v}">${ETQ[v]||esc(v)}</span></span></div>
    <p style="margin-top:4px"><b>${esc(o.nombre)}</b> · ${esc(o.curso)} · ${money(o.total)} ${pg}</p>
    <p class="mut">${o.items.map(i=>i.cant+' × '+esc(i.nombre)).join(', ')} · ${TURNOS.find(t=>t.id===o.turno)?.n||''}</p>
    ${activo?`<div class="acts">
      ${o.estado==='pendiente'&&v!=='vencido'?`<button onclick="cambiar('${o.id}','listo')">Listo para retirar</button>`:''}
      ${o.metodo==='transferencia'&&o.pago!=='cobrado'?`<button class="am" onclick="cambiar('${o.id}','transf')">Confirmar transferencia</button>`:''}
      <button class="ok" onclick="cambiar('${o.id}','cobrar')">Retirado y cobrado</button>
      ${v==='vencido'?`<button class="am" onclick="cambiar('${o.id}','noretiro')">No retiró</button>`:''}
      <button class="no" onclick="cambiar('${o.id}','cancelar')">Cancelar</button></div>`:''}
    ${cerrado?`<div class="acts"><button onclick="cambiar('${o.id}','reabrir')">Reabrir</button></div>`:''}</div>`;
  }).join('')||'<div class="card mut">No hay pedidos para esta fecha y recreo.</div>';
}
window.addEventListener('storage',()=>render(true));
setInterval(()=>render(true),10000);
sessionStorage.getItem('b411_staff')?panel():lockScreen();
</script></body></html>
